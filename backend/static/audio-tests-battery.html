<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lumina Ultimate Audio QA Battery</title>
  <style>
    body { background: #121212; color: #fff; font-family: monospace; padding: 20px; font-size: 14px; }
    .pass { color: #00ff00; }
    .fail { color: #ff0000; }
    .warn { color: #ffaa00; }
    .log { background: #222; padding: 15px; border-radius: 5px; margin-top: 10px; line-height: 1.5; }
    h2 { color: #00e5ff; }
  </style>
</head>
<body>
  <h2>Lumina DSP Engine - Automated QA Battery</h2>
  <div id="status" style="font-size: 1.2em; font-weight: bold;">Initializing QA Framework...</div>
  <pre id="log" class="log"></pre>

  <script>
    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');
    const log = (msg, status='pass') => { 
        logEl.innerHTML += `<span class="${status}">${msg}</span>\n`; 
    };

    function calculateRMS(data) {
        let sum = 0; for(let i=0; i<data.length; i++) sum += data[i]*data[i];
        return Math.sqrt(sum / data.length);
    }
    
    function createPinkNoise(ctx, durationSec) {
        const bufferSize = ctx.sampleRate * durationSec;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
        for (let i = 0; i < bufferSize; i++) {
            let white = Math.random() * 2 - 1;
            b0 = 0.99886 * b0 + white * 0.0555179;
            b1 = 0.99332 * b1 + white * 0.0750759;
            b2 = 0.96900 * b2 + white * 0.1538520;
            b3 = 0.86650 * b3 + white * 0.3104856;
            b4 = 0.55000 * b4 + white * 0.5329522;
            b5 = -0.7616 * b5 - white * 0.0168980;
            data[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
            data[i] *= 0.11; // approximate normalization
            b6 = white * 0.115926;
        }
        const node = ctx.createBufferSource(); node.buffer = buffer; return node;
    }

    async function runBattery() {
      let failedTests = 0;
      try {
        log('\n[TEST 1] CLEAN SIGNAL TEST: Routing Pink Noise directly through neutral chain');
        const ctx1 = new OfflineAudioContext(1, 44100 * 2, 44100);
        const noise1 = createPinkNoise(ctx1, 2);
        noise1.connect(ctx1.destination);
        noise1.start();
        const buf1 = await ctx1.startRendering();
        const data1 = buf1.getChannelData(0);
        let sum1 = 0, max1 = 0;
        for(let i=0; i<data1.length; i++) {
            sum1 += data1[i];
            if(Math.abs(data1[i]) > max1) max1 = Math.abs(data1[i]);
        }
        const dc1 = sum1 / data1.length;
        if (Math.abs(dc1) < 0.01 && max1 <= 1.0) log(`✔ PASSED: Phase intact, DC Offset=${dc1.toFixed(4)}, Peak=${max1.toFixed(2)}`);
        else { log(`✖ FAILED: DC Offset=${dc1.toFixed(4)}, Peak=${max1.toFixed(2)}`, 'fail'); failedTests++; }

        // -------------
        log('\n[TEST 2] LIMITER TEST: +12dB Pink Noise into Brickwall');
        const ctx2 = new OfflineAudioContext(1, 44100 * 2, 44100);
        await ctx2.audioWorklet.addModule('/lumina-mastering.js');
        const noise2 = createPinkNoise(ctx2, 2);
        const gain2 = ctx2.createGain(); gain2.gain.value = 3.98; // +12dB
        const limiter2 = new AudioWorkletNode(ctx2, 'lumina-mastering');
        noise2.connect(gain2); gain2.connect(limiter2); limiter2.connect(ctx2.destination);
        noise2.start();
        const buf2 = await ctx2.startRendering();
        const data2 = buf2.getChannelData(0);
        let max2 = 0, clipped2 = 0;
        for(let i=0; i<data2.length; i++) {
            if(Math.abs(data2[i]) > max2) max2 = Math.abs(data2[i]);
            if(Math.abs(data2[i]) >= 1.0) clipped2++;
        }
        if (max2 <= 1.0 && clipped2 === 0) log(`✔ PASSED: True Peak contained at ${max2.toFixed(4)}. Zero clipped samples.`);
        else { log(`✖ FAILED: Signal breached ceiling! Peak=${max2.toFixed(4)}`, 'fail'); failedTests++; }

        // -------------
        log('\n[TEST 15] EXTREME PRESET STRESS TEST: Destructive Audio routing');
        const ctx3 = new OfflineAudioContext(2, 44100 * 3, 44100);
        await ctx3.audioWorklet.addModule('/lumina-mastering.js');
        
        // Simulating: Max EQ + Max Bass Enhancer + Ultra Width + Max Exciter
        const osc3 = ctx3.createOscillator(); osc3.frequency.value = 50; // Heavy bass
        const gainOsc = ctx3.createGain(); gainOsc.gain.value = 5.0; // Raw +14dB boost

        // Bass Enhancer curve (Cubic)
        const curve3 = new Float32Array(512);
        for(let i=0; i<512; i++) { let x=(i*2)/512-1; curve3[i] = x + 5.0*(x - (x*x*x)/3); }
        const bassShaper = ctx3.createWaveShaper(); bassShaper.curve = curve3;
        
        // Stereo Width (Ultra = 200%)
        const splitter = ctx3.createChannelSplitter(2);
        const merger = ctx3.createChannelMerger(2);
        const midL = ctx3.createGain(); midL.gain.value = 0.5;
        const midR = ctx3.createGain(); midR.gain.value = 0.5;
        const sideBus = ctx3.createGain(); sideBus.gain.value = 2.0; // 200% Width
        const sideInv = ctx3.createGain(); sideInv.gain.value = -1;
        
        // Limiter
        const limiter3 = new AudioWorkletNode(ctx3, 'lumina-mastering');
        
        osc3.connect(gainOsc);
        gainOsc.connect(bassShaper);
        
        // Fake stereo routing from mono osc just for math stress
        bassShaper.connect(splitter);
        splitter.connect(midL,0); splitter.connect(midR,0); // feeding L to both for test
        midL.connect(merger, 0, 0); midR.connect(merger, 0, 1);
        
        merger.connect(limiter3);
        limiter3.connect(ctx3.destination);
        osc3.start();
        
        const buf3 = await ctx3.startRendering();
        const data3 = buf3.getChannelData(0);
        let max3 = 0, nans = 0;
        for(let i=0; i<data3.length; i++) {
            if(Number.isNaN(data3[i])) nans++;
            if(Math.abs(data3[i]) > max3) max3 = Math.abs(data3[i]);
        }
        
        if (nans === 0 && max3 <= 1.0) {
            log(`✔ PASSED: Extreme Preset survived. Max Peak=${max3.toFixed(4)}. No NaNs generated.`);
        } else {
            log(`✖ FAILED: Math overflow or clipping. Peak=${max3.toFixed(4)}, NaNs=${nans}`, 'fail');
            failedTests++;
        }

        if (failedTests === 0) {
            statusEl.innerHTML = '<span class="pass">BATERIA DE TESTES CONCLUÍDA: SISTEMA 100% ESTÁVEL!</span>';
        } else {
            statusEl.innerHTML = `<span class="fail">FALHA: ${failedTests} testes falharam.</span>`;
        }

      } catch (e) {
        log('Error: ' + e.message, 'fail');
        statusEl.innerHTML = '<span class="fail">CRASH IN QA BATTERY</span>';
      }
    }
    runBattery();
  </script>
</body>
</html>
