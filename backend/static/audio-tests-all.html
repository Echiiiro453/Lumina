<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lumina DSP Synthetic Tests</title>
  <style>
    body { background: #121212; color: #fff; font-family: monospace; padding: 20px; }
    .pass { color: #00ff00; }
    .fail { color: #ff0000; }
    .log { background: #222; padding: 10px; border-radius: 5px; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>Lumina All Functions - Mathematical Purity Test</h2>
  <div id="status">Running Tests...</div>
  <pre id="log" class="log"></pre>

  <script>
    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');
    const log = (msg, isError=false) => { 
        logEl.innerHTML += `<span class="${isError?'fail':'pass'}">${msg}</span>\n`; 
    };

    async function testExciter() {
      log('\n--- TESTING HARMONIC EXCITER (WaveShaper) ---');
      const ctx = new OfflineAudioContext(1, 44100, 44100);
      const osc = ctx.createOscillator();
      const amount = 14; // 'strong'
      const n = 256;
      const curve = new Float32Array(n);
      for (let i = 0; i < n; i++) {
        const x = (i * 2) / n - 1;
        curve[i] = (Math.PI + amount) * x / (Math.PI + amount * Math.abs(x));
      }
      const shaper = ctx.createWaveShaper();
      shaper.curve = curve;
      osc.connect(shaper); shaper.connect(ctx.destination);
      osc.start();
      const buf = await ctx.startRendering();
      const data = buf.getChannelData(0);
      let max = 0, min = 0, sum = 0;
      for (let i=0; i<data.length; i++) {
        sum += data[i];
        if (data[i] > max) max = data[i];
        if (data[i] < min) min = data[i];
      }
      log(`Max Peak: ${max.toFixed(4)}, Min Peak: ${min.toFixed(4)}`);
      log(`DC Offset: ${(sum/data.length).toFixed(6)}`);
      log(`Symmetry Delta: ${(Math.abs(max) - Math.abs(min)).toFixed(6)}`);
      if (Math.abs(sum/data.length) > 0.05) log(`ERROR: DC OFFSET DETECTED!`, true);
      else log(`Exciter Math is PERFECT.`);
    }

    async function testStereoWidth() {
      log('\n--- TESTING STEREO WIDTH (M/S MATRIX) ---');
      const ctx = new OfflineAudioContext(2, 44100, 44100);
      
      // Inject pure left-panned sine wave to test matrix algebra
      const osc = ctx.createOscillator();
      const panner = ctx.createStereoPanner();
      panner.pan.value = -1; // 100% Left

      const wSplit = ctx.createChannelSplitter(2);
      const wMerge = ctx.createChannelMerger(2);
      const midL = ctx.createGain(); midL.gain.value = 0.5;
      const midR = ctx.createGain(); midR.gain.value = 0.5;
      const midBus = ctx.createGain();
      const sidePL = ctx.createGain(); sidePL.gain.value = 0.5;
      const sideNR = ctx.createGain(); sideNR.gain.value = -0.5;
      
      const sideBus = ctx.createGain(); sideBus.gain.value = 2.2; // 'ultra' width
      const sideInv = ctx.createGain(); sideInv.gain.value = -1;

      osc.connect(panner); panner.connect(wSplit);
      wSplit.connect(midL, 0); wSplit.connect(midR, 1);
      midL.connect(midBus); midR.connect(midBus);
      wSplit.connect(sidePL, 0); wSplit.connect(sideNR, 1);
      sidePL.connect(sideBus); sideNR.connect(sideBus);
      sideBus.connect(sideInv);
      midBus.connect(wMerge, 0, 0); sideBus.connect(wMerge, 0, 0);
      midBus.connect(wMerge, 0, 1); sideInv.connect(wMerge, 0, 1);
      wMerge.connect(ctx.destination);

      osc.start();
      const buf = await ctx.startRendering();
      let peakL = 0, peakR = 0;
      const L = buf.getChannelData(0), R = buf.getChannelData(1);
      for(let i=0; i<L.length; i++){
        if (Math.abs(L[i]) > peakL) peakL = Math.abs(L[i]);
        if (Math.abs(R[i]) > peakR) peakR = Math.abs(R[i]);
      }
      log(`Peak Out L: ${peakL.toFixed(4)}, Peak Out R: ${peakR.toFixed(4)}`);
      
      // Algebra verification: 
      // Input: L=1, R=0
      // Mid = (L+R)*0.5 = 0.5
      // Side = (L-R)*0.5 = 0.5
      // With Side Gain = 2.2 -> Side becomes 1.1
      // Final L = Mid + Side = 0.5 + 1.1 = 1.6
      // Final R = Mid - Side = 0.5 - 1.1 = -0.6
      // Peak absolute values should be 1.6 and 0.6
      
      const checkL = Math.abs(peakL - 1.6) < 0.1;
      const checkR = Math.abs(peakR - 0.6) < 0.1;
      
      if (checkL && checkR) {
        log(`M/S Matrix Phase Correlation is PERFECT. No destructive interference.`);
      } else {
        log(`M/S MATRIX FAILED: Out of phase calculation!`, true);
      }
    }

    async function runAll() {
      try {
        await testExciter();
        await testStereoWidth();
        statusEl.innerHTML = '<span class="pass">All Audits Passed Successfully!</span>';
      } catch (e) {
        log('Error: ' + e.message, true);
        statusEl.innerHTML = '<span class="fail">CRASH IN TESTS</span>';
      }
    }
    runAll();
  </script>
</body>
</html>
