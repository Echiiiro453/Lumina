<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <title>Lumina Audio Chain - Testes Sintéticos</title>
  <style>

<body>
  <h1>🎛️ Lumina — Testes Sintéticos de Áudio</h1>
  <p class="sub">Gera sinais de teste (seno, ruído, impulso) e verifica matematicamente cada nó da chain.</p>
  <button id="run-btn" onclick="runAllTests()">▶ Executar Todos os Testes</button>
  <div id="results"></div>
  <div id="summary" style="display:none"></div>
  <canvas id="scope" width="700" height="120" style="display:none"></canvas>

<script>
// ============================================================
// HELPERS
// ============================================================
function rms(buffer) {
  let sum = 0;
  for (let i = 0; i < buffer.length; i++) sum += buffer[i] * buffer[i];
  return Math.sqrt(sum / buffer.length);
}

function db(value) {
  return 20 * Math.log10(Math.max(value, 1e-9));
}

function generateSine(ctx, freq, durationSec, amplitude = 0.5) {
  const len = Math.round(ctx.sampleRate * durationSec);
  const buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < len; i++) {
      d[i] = amplitude * Math.sin((2 * Math.PI * freq * i) / ctx.sampleRate);
    }
  }
  return buf;
}

// Compute RMS of a sine wave analytically (amplitude / sqrt(2))
function sineRms(amplitude) { return amplitude / Math.sqrt(2); }

function generateNoise(ctx, durationSec, amplitude = 0.5) {
  const len = Math.round(ctx.sampleRate * durationSec);
  const buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * amplitude;
  }
  return buf;
}

function generateImpulse(ctx, amplitude = 0.9) {
  const len = 2048;
  const buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    d[0] = amplitude;
  }
  return buf;
}

// Processes a buffer through a chain of nodes (connects linearly) and returns output Float32Array
function processChain(ctx, inputBuffer, nodes) {
  return new Promise((resolve) => {
    const srcNode = ctx.createBufferSource();
    srcNode.buffer = inputBuffer;

    const len = inputBuffer.length;
    const outputBuffer = ctx.createBuffer(2, len, ctx.sampleRate);
    const dest = ctx.createBufferSource(); // dummy

    // Use OfflineAudioContext equivalent: re-create inline
    const offline = new OfflineAudioContext(2, len, ctx.sampleRate);

    const offlineSrc = offline.createBufferSource();
    offlineSrc.buffer = inputBuffer;

    let chain = offlineSrc;
    for (const builder of nodes) {
      const node = builder(offline);
      chain.connect(node);
      chain = node;
    }
    chain.connect(offline.destination);
    offlineSrc.start(0);

    offline.startRendering().then((rendered) => {
      resolve(rendered.getChannelData(0));
    }).catch(e => resolve(null));
  });
}

// ============================================================
// UI
// ============================================================
let pass = 0, fail = 0, skip = 0;
const results = [];

function addResult(name, status, detail) {
  results.push({ name, status, detail });
  const div = document.createElement('div');
  div.className = `test-card ${status}`;
  div.innerHTML = `
    <div class="test-header">
      <span class="badge ${status}">${status === 'pass' ? '✓ PASS' : status === 'fail' ? '✗ FAIL' : status === 'running' ? '… RODANDO' : '⚠ SKIP'}</span>
      <span class="test-name">${name}</span>
    </div>
    ${detail ? `<div class="test-detail">${detail}</div>` : ''}
  `;
  document.getElementById('results').appendChild(div);
}

function showSummary() {
  const el = document.getElementById('summary');
  el.style.display = 'block';
  const total = pass + fail + skip;
  el.innerHTML = `
    <strong style="font-size:1rem">Resultado Final</strong><br/>
    <span style="color:#22c55e">✓ ${pass} PASS</span> &nbsp;
    <span style="color:#ef4444">✗ ${fail} FAIL</span> &nbsp;
    <span style="color:#f59e0b">⚠ ${skip} SKIP</span> &nbsp;
    (de ${total} testes)
  `;
}

// ============================================================
// TESTS
// ============================================================

async function test_audioContext() {
  try {
    const ctx = new AudioContext();
    await ctx.suspend();
    const ok = ctx.state !== 'closed' && ctx.sampleRate >= 44100;
    await ctx.close();
    if (ok) { pass++; addResult('AudioContext: Criação e sampleRate', 'pass', `sampleRate: ${ctx.sampleRate} Hz | state: OK`); }
    else     { fail++; addResult('AudioContext: Criação e sampleRate', 'fail', `sampleRate: ${ctx.sampleRate}`); }
  } catch(e) { fail++; addResult('AudioContext: Criação e sampleRate', 'fail', e.message); }
}

async function test_eq_passthrough() {
  try {
    const ctx = new OfflineAudioContext(2, 44100, 44100);
    const src = ctx.createBufferSource();
    src.buffer = generateSine(ctx, 1000, 1.0, 0.5);

    const filter = ctx.createBiquadFilter();
    filter.type = 'peaking'; filter.frequency.value = 1000;
    filter.Q.value = 1.0; filter.gain.value = 0; // 0dB = passthrough

    src.connect(filter); filter.connect(ctx.destination); src.start(0);
    const rendered = await ctx.startRendering();
    const data = rendered.getChannelData(0);
    const inputRms = sineRms(0.5); // analytical RMS of a 0.5-amplitude sine
    const outputRms = rms(data);
    const diff = Math.abs(db(outputRms) - db(inputRms));
    if (diff < 0.5) { pass++; addResult('EQ: BiquadFilter 0dB passthrough', 'pass', `Diff: ${diff.toFixed(3)} dB (esperado < 0.5dB)`); }
    else            { fail++; addResult('EQ: BiquadFilter 0dB passthrough', 'fail', `Diff: ${diff.toFixed(2)} dB — sinal alterado inesperadamente`); }
  } catch(e) { fail++; addResult('EQ: BiquadFilter 0dB passthrough', 'fail', e.message); }
}

async function test_eq_boost() {
  try {
    const dur = 1.0;
    const sr = 44100;
    const ctx = new OfflineAudioContext(1, sr * dur, sr);
    const src = ctx.createBufferSource();
    src.buffer = generateSine(ctx, 1000, dur, 0.3);

    const filter = ctx.createBiquadFilter();
    filter.type = 'peaking'; filter.frequency.value = 1000;
    filter.Q.value = 1.0; filter.gain.value = 6; // +6dB boost

    src.connect(filter); filter.connect(ctx.destination); src.start(0);
    const rendered = await ctx.startRendering();
    const outRms = rms(rendered.getChannelData(0));
    const inRms = sineRms(0.3); // analytical RMS
    const boostDb = db(outRms) - db(inRms);

    if (boostDb > 4 && boostDb < 8) { pass++; addResult('EQ: +6dB boost a 1kHz', 'pass', `Boost medido: ${boostDb.toFixed(2)} dB (esperado ~6dB)`); }
    else                             { fail++; addResult('EQ: +6dB boost a 1kHz', 'fail', `Boost medido: ${boostDb.toFixed(2)} dB — fora do esperado`); }
  } catch(e) { fail++; addResult('EQ: +6dB boost a 1kHz', 'fail', e.message); }
}

async function test_wavetable_exciter() {
  try {
    const dur = 0.5;
    const sr = 44100;
    const ctx = new OfflineAudioContext(1, sr * dur, sr);
    const src = ctx.createBufferSource();
    src.buffer = generateSine(ctx, 440, dur, 0.5);

    const shaper = ctx.createWaveShaper();
    shaper.oversample = '4x';
    // Soft clip curve (distortion)
    const n = 256; const curve = new Float32Array(n);
    const amount = 6;
    for (let i = 0; i < n; i++) {
      const x = (i * 2) / n - 1;
      curve[i] = (Math.PI + amount) * x / (Math.PI + amount * Math.abs(x));
    }
    shaper.curve = curve;

    src.connect(shaper); shaper.connect(ctx.destination); src.start(0);
    const rendered = await ctx.startRendering();
    const out = rendered.getChannelData(0);
    const inRms = sineRms(0.5); // analytical RMS of input
    const outRms = rms(out);
    // WaveShaper soft clip changes waveform shape — output will differ from input RMS
    const diff = Math.abs(db(outRms) - db(inRms));
    const hasHarmonics = diff > 0.01;
    if (hasHarmonics) { pass++; addResult('Harmonic Exciter: WaveShaper processando', 'pass', `Curva aplicada. Diff RMS: ${diff.toFixed(3)} dB (confirma saturação harmônica)`); }
    else              { fail++; addResult('Harmonic Exciter: WaveShaper processando', 'fail', `WaveShaper não alterou o sinal. Diff: ${diff.toFixed(4)} dB`); }
  } catch(e) { fail++; addResult('Harmonic Exciter: WaveShaper processando', 'fail', e.message); }
}

async function test_limiter() {
  try {
    const dur = 0.5;
    const sr = 44100;
    const ctx = new OfflineAudioContext(1, sr * dur, sr);
    const src = ctx.createBufferSource();
    // Hot signal (amplitude 0.95, above limiter threshold)
    src.buffer = generateSine(ctx, 440, dur, 0.95);

    const limiter = ctx.createDynamicsCompressor();
    limiter.threshold.value = -1;
    limiter.knee.value = 0;
    limiter.ratio.value = 20;
    limiter.attack.value = 0.001;
    limiter.release.value = 0.1;

    src.connect(limiter); limiter.connect(ctx.destination); src.start(0);
    const rendered = await ctx.startRendering();
    const out = rendered.getChannelData(0);
    // Skip first 20ms — DynamicsCompressor OfflineContext lookahead + attack window
    const attackSamples = Math.round(sr * 0.020);
    const steadyState = out.slice(attackSamples);
    const maxOut = Math.max(...Array.from(steadyState).map(Math.abs));
    // After attack, limiter should hold peaks near/below -1dBFS (~0.891 linear)
    if (maxOut < 0.98) { pass++; addResult('Limiter (Brickwall): Pico contido', 'pass', `Pico em regime (após ${attackSamples} amostras): ${db(maxOut).toFixed(2)} dBFS`); }
    else               { fail++; addResult('Limiter (Brickwall): Pico contido', 'fail', `Pico em regime: ${maxOut.toFixed(4)} — limiter não ativo?`); }
  } catch(e) { fail++; addResult('Limiter (Brickwall): Pico contido', 'fail', e.message); }
}

async function test_convolver_reverb() {
  try {
    const dur = 1.0;
    const sr = 44100;
    const ctx = new OfflineAudioContext(2, sr * dur, sr);
    const src = ctx.createBufferSource();
    // Impulse signal: single sample burst, then silence
    const imp = ctx.createBuffer(2, sr, sr);
    for (let c = 0; c < 2; c++) imp.getChannelData(c)[0] = 0.9;
    src.buffer = imp;

    // Build IR (same as createReverbIR)
    const irLen = sr * 2.0;
    const irBuf = ctx.createBuffer(2, irLen, sr);
    for (let c = 0; c < 2; c++) {
      const d = irBuf.getChannelData(c);
      for (let i = 0; i < irLen; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / irLen, 2.5);
    }
    const convolver = ctx.createConvolver();
    convolver.buffer = irBuf;

    src.connect(convolver); convolver.connect(ctx.destination); src.start(0);
    const rendered = await ctx.startRendering();
    const out = rendered.getChannelData(0);

    // After the impulse, reverb tail should have energy beyond sample 100
    const tail = Array.from(out.slice(100, 5000));
    const tailRms = rms(tail);
    if (tailRms > 0.001) { pass++; addResult('Reverb (Convolver): Cauda de reverb', 'pass', `RMS da cauda: ${db(tailRms).toFixed(2)} dB — reverb está ativo`); }
    else                 { fail++; addResult('Reverb (Convolver): Cauda de reverb', 'fail', `Nenhuma cauda detectada. RMS: ${tailRms.toFixed(6)}`); }
  } catch(e) { fail++; addResult('Reverb (Convolver): Cauda de reverb', 'fail', e.message); }
}

async function test_crossfeed_bleed() {
  try {
    const dur = 0.3;
    const sr = 44100;
    const len = Math.round(sr * dur);

    // Input: signal only on LEFT channel
    const ctx = new OfflineAudioContext(2, len, sr);
    const buf = ctx.createBuffer(2, len, sr);
    const l = buf.getChannelData(0);
    const r = buf.getChannelData(1);
    for (let i = 0; i < len; i++) { l[i] = Math.sin(2 * Math.PI * 440 * i / sr); r[i] = 0; }

    const src = ctx.createBufferSource(); src.buffer = buf;
    const splitter = ctx.createChannelSplitter(2);
    const merger = ctx.createChannelMerger(2);
    const hs = ctx.createBiquadFilter(); hs.type = 'lowpass'; hs.frequency.value = 700;
    const bleedGain = ctx.createGain(); bleedGain.gain.value = 0.2;

    // L -> direct -> outL; L -> hs -> bleed -> outR
    src.connect(splitter);
    splitter.connect(merger, 0, 0); // L->outL direct
    splitter.connect(merger, 1, 1); // R->outR direct (silence)
    splitter.connect(hs, 0); hs.connect(bleedGain); bleedGain.connect(merger, 0, 1); // L bleed -> outR
    merger.connect(ctx.destination); src.start(0);

    const rendered = await ctx.startRendering();
    const outR = rendered.getChannelData(1);
    const rmsR = rms(outR);
    // Right channel should now have crossfeed signal from left
    if (rmsR > 0.001) { pass++; addResult('Crossfeed: Vazamento L→R', 'pass', `RMS no canal direito: ${db(rmsR).toFixed(2)} dB — crossfeed ativo`); }
    else              { fail++; addResult('Crossfeed: Vazamento L→R', 'fail', `Canal direito permanece silencioso (${rmsR.toFixed(6)}) — sem crossfeed`); }
  } catch(e) { fail++; addResult('Crossfeed: Vazamento L→R', 'fail', e.message); }
}

async function test_stereo_width_ms() {
  try {
    const dur = 0.3;
    const sr = 44100;
    const len = Math.round(sr * dur);

    // Input: stereo noise
    const ctx = new OfflineAudioContext(2, len, sr);
    const buf = ctx.createBuffer(2, len, sr);
    const l = buf.getChannelData(0), r = buf.getChannelData(1);
    for (let i = 0; i < len; i++) { l[i] = Math.random() * 2 - 1; r[i] = Math.random() * 2 - 1; }

    const src = ctx.createBufferSource(); src.buffer = buf;
    // M/S: narrow (sideBus gain = 0.4)
    const splitter = ctx.createChannelSplitter(2);
    const merger = ctx.createChannelMerger(2);
    const midL = ctx.createGain(); midL.gain.value = 0.5;
    const midR = ctx.createGain(); midR.gain.value = 0.5;
    const midBus = ctx.createGain();
    const sidePL = ctx.createGain(); sidePL.gain.value = 0.5;
    const sideNR = ctx.createGain(); sideNR.gain.value = -0.5;
    const sideBus = ctx.createGain(); sideBus.gain.value = 0.4; // narrow
    const sideInv = ctx.createGain(); sideInv.gain.value = -1;

    src.connect(splitter);
    splitter.connect(midL, 0); splitter.connect(midR, 1);
    midL.connect(midBus); midR.connect(midBus);
    splitter.connect(sidePL, 0); splitter.connect(sideNR, 1);
    sidePL.connect(sideBus); sideNR.connect(sideBus);
    sideBus.connect(sideInv);
    midBus.connect(merger, 0, 0); sideBus.connect(merger, 0, 0);
    midBus.connect(merger, 0, 1); sideInv.connect(merger, 0, 1);
    merger.connect(ctx.destination); src.start(0);

    const rendered = await ctx.startRendering();
    const outL = rendered.getChannelData(0);
    const outR = rendered.getChannelData(1);
    // With narrow, L and R should be more similar (close to mono)
    const diff = outL.map((s, i) => s - outR[i]);
    const sideEnergy = rms(diff);
    if (sideEnergy < 0.6) { pass++; addResult('Stereo Width: M/S Narrow (<mono correl.)', 'pass', `Energia lateral: ${db(sideEnergy).toFixed(2)} dB — sinal mais "narrado"`); }
    else                  { fail++; addResult('Stereo Width: M/S Narrow (<mono correl.)', 'fail', `Energia lateral muito alta: ${db(sideEnergy).toFixed(2)} dB`); }
  } catch(e) { fail++; addResult('Stereo Width: M/S Narrow (<mono correl.)', 'fail', e.message); }
}

async function test_audioworklet_available() {
  try {
    const ctx = new AudioContext();
    const ok = typeof ctx.audioWorklet?.addModule === 'function';
    await ctx.close();
    if (ok) { pass++; addResult('AudioWorklet: API disponível', 'pass', 'audioWorklet.addModule() está presente — worklets podem ser carregados'); }
    else    { skip++; addResult('AudioWorklet: API disponível', 'skip', 'audioWorklet API não disponível neste ambiente'); }
  } catch(e) { fail++; addResult('AudioWorklet: API disponível', 'fail', e.message); }
}

async function test_worklet_transient() {
  const card = { name: 'Transient Shaper Worklet: carregamento e processamento' };
  try {
    const ctx = new AudioContext();
    try {
      await ctx.audioWorklet.addModule('/transient-processor.js');
    } catch(loadErr) {
      await ctx.close();
      skip++; addResult(card.name, 'skip', `Arquivo não encontrado (serve com "npm run dev" ativo?): ${loadErr.message}`);
      return;
    }
    const node = new AudioWorkletNode(ctx, 'transient-shaper');
    const ok = !!node;
    await ctx.close();
    if (ok) { pass++; addResult(card.name, 'pass', 'AudioWorkletNode criado com sucesso — processador registrado corretamente'); }
    else    { fail++; addResult(card.name, 'fail', 'Worklet carregou mas node não criado'); }
  } catch(e) { fail++; addResult(card.name, 'fail', e.message); }
}

async function test_worklet_master_out_crash_guard() {
  const card = { name: 'MasterOut Worklet: Crash Guard & Safe Bypass' };
  try {
    const ctx = new OfflineAudioContext(2, 44100, 44100);
    try {
      await ctx.audioWorklet.addModule('/master-out-processor.js');
    } catch(loadErr) {
      skip++; addResult(card.name, 'skip', `Arquivo não encontrado: ${loadErr.message}`);
      return;
    }
    
    // Cria buffer de teste
    const buf = ctx.createBuffer(2, 44100, 44100);
    const L = buf.getChannelData(0);
    const R = buf.getChannelData(1);
    for (let i = 0; i < 44100; i++) {
      L[i] = 0.5 * Math.sin(2 * Math.PI * 440 * i / 44100);
      R[i] = 0.5 * Math.sin(2 * Math.PI * 440 * i / 44100);
    }
    
    const src = ctx.createBufferSource();
    src.buffer = buf;
    
    const node = new AudioWorkletNode(ctx, 'master-out', { 
      numberOfInputs: 1, 
      numberOfOutputs: 1, 
      outputChannelCount: [2] 
    });
    
    let errorReceived = false;
    node.port.onmessage = (e) => {
      if (e.data.type === 'error' && e.data.name === 'MasterOut' && e.data.safeBypassActive === true) {
        errorReceived = true;
      }
    };
    
    // Força o erro no Worklet
    node.port.postMessage({ triggerError: true });
    
    src.connect(node);
    node.connect(ctx.destination);
    
    src.start(0);
    
    // Pequena pausa para garantir a entrega da mensagem antes do rendering começar
    await new Promise(r => setTimeout(r, 20));
    
    const rendered = await ctx.startRendering();
    
    // Aguarda a mensagem assíncrona da porta
    await new Promise(r => setTimeout(r, 50));
    
    // Calcula RMS do buffer renderizado
    let sum = 0;
    const outData = rendered.getChannelData(0);
    for (let i = 0; i < outData.length; i++) {
      sum += outData[i] * outData[i];
    }
    const rms = Math.sqrt(sum / outData.length);
    const rmsDb = 20 * Math.log10(Math.max(rms, 1e-12));
    
    const hasSignal = rmsDb > -30;
    
    if (errorReceived && hasSignal) {
      pass++;
      addResult(card.name, 'pass', `Erro capturado com sucesso e bypass ativo (sinal preservado em ${rmsDb.toFixed(1)} dB)`);
    } else {
      fail++;
      addResult(card.name, 'fail', `Crash Guard falhou. Erro capturado: ${errorReceived} | Sinal RMS: ${rmsDb.toFixed(1)} dB`);
    }
  } catch(e) { 
    fail++; 
    addResult(card.name, 'fail', e.message); 
  }
}

async function test_eq_cut() {
  // -6dB cut at 1kHz should reduce energy at 1kHz by ~6dB
  try {
    const sr = 44100; const dur = 1.0;
    const ctx = new OfflineAudioContext(1, sr * dur, sr);
    const src = ctx.createBufferSource();
    src.buffer = generateSine(ctx, 1000, dur, 0.5);
    const f = ctx.createBiquadFilter(); f.type = 'peaking';
    f.frequency.value = 1000; f.Q.value = 1.0; f.gain.value = -6;
    src.connect(f); f.connect(ctx.destination); src.start(0);
    const rendered = await ctx.startRendering();
    const cutDb = db(rms(rendered.getChannelData(0))) - db(sineRms(0.5));
    if (cutDb < -4 && cutDb > -8) { pass++; addResult('EQ: -6dB corte a 1kHz', 'pass', `Corte medido: ${cutDb.toFixed(2)} dB (esperado ~-6dB)`); }
    else { fail++; addResult('EQ: -6dB corte a 1kHz', 'fail', `Corte medido: ${cutDb.toFixed(2)} dB — fora do esperado`); }
  } catch(e) { fail++; addResult('EQ: -6dB corte a 1kHz', 'fail', e.message); }
}

async function test_eq_selectivity() {
  // +6dB at 1kHz should barely affect energy at 10kHz (less than 2dB spillover)
  try {
    const sr = 44100; const dur = 1.0;
    const ctxRef  = new OfflineAudioContext(1, sr * dur, sr);
    const ctxBoost = new OfflineAudioContext(1, sr * dur, sr);

    const render = async (ctx, gainDb) => {
      const src = ctx.createBufferSource();
      src.buffer = generateSine(ctx, 10000, dur, 0.5);
      const f = ctx.createBiquadFilter(); f.type = 'peaking';
      f.frequency.value = 1000; f.Q.value = 1.0; f.gain.value = gainDb;
      src.connect(f); f.connect(ctx.destination); src.start(0);
      return ctx.startRendering();
    };

    const [ref, boosted] = await Promise.all([render(ctxRef, 0), render(ctxBoost, 6)]);
    const diff = Math.abs(db(rms(boosted.getChannelData(0))) - db(rms(ref.getChannelData(0))));
    if (diff < 2.0) { pass++; addResult('EQ: Seletividade (1kHz boost não afeta 10kHz)', 'pass', `Spillover medido: ${diff.toFixed(3)} dB (esperado < 2dB)`); }
    else            { fail++; addResult('EQ: Seletividade (1kHz boost não afeta 10kHz)', 'fail', `Spillover: ${diff.toFixed(2)} dB — filtro muito largo?`); }
  } catch(e) { fail++; addResult('EQ: Seletividade (1kHz boost não afeta 10kHz)', 'fail', e.message); }
}

async function test_eq_lowshelf() {
  // Lowshelf +6dB at 100Hz should boost 32Hz but not 4kHz
  try {
    const sr = 44100; const dur = 1.0;
    const render = async (freq) => {
      const ctx = new OfflineAudioContext(1, sr * dur, sr);
      const src = ctx.createBufferSource();
      src.buffer = generateSine(ctx, freq, dur, 0.3);
      const f = ctx.createBiquadFilter(); f.type = 'lowshelf';
      f.frequency.value = 100; f.gain.value = 6;
      src.connect(f); f.connect(ctx.destination); src.start(0);
      const r = await ctx.startRendering();
      return rms(r.getChannelData(0));
    };
    const [rmsLow, rmsHigh] = await Promise.all([render(32), render(4000)]);
    const boostLow  = db(rmsLow)  - db(sineRms(0.3));
    const boostHigh = db(rmsHigh) - db(sineRms(0.3));
    if (boostLow > 3 && boostHigh < 1) { pass++; addResult('EQ: Lowshelf +6dB (32Hz elevado, 4kHz intacto)', 'pass', `32Hz: ${boostLow.toFixed(2)}dB | 4kHz: ${boostHigh.toFixed(2)}dB`); }
    else { fail++; addResult('EQ: Lowshelf +6dB (32Hz elevado, 4kHz intacto)', 'fail', `32Hz: ${boostLow.toFixed(2)}dB | 4kHz: ${boostHigh.toFixed(2)}dB`); }
  } catch(e) { fail++; addResult('EQ: Lowshelf +6dB (32Hz elevado, 4kHz intacto)', 'fail', e.message); }
}

async function test_clipping_protection() {
  // Input at +6dBFS (amplitude 2.0) → with limiter, no sample should exceed 1.0
  try {
    const sr = 44100; const dur = 0.5;
    const ctx = new OfflineAudioContext(1, Math.round(sr * dur), sr);
    const src = ctx.createBufferSource();
    const buf = ctx.createBuffer(1, Math.round(sr * dur), sr);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = 2.0 * Math.sin(2 * Math.PI * 440 * i / sr); // +6dBFS
    src.buffer = buf;
    const limiter = ctx.createDynamicsCompressor();
    limiter.threshold.value = -1; limiter.knee.value = 0;
    limiter.ratio.value = 20; limiter.attack.value = 0.001; limiter.release.value = 0.1;
    src.connect(limiter); limiter.connect(ctx.destination); src.start(0);
    const rendered = await ctx.startRendering();
    const out = rendered.getChannelData(0);
    // Skip first 25ms — OfflineAudioContext DynamicsCompressor needs more convergence time with hot signals
    const attackSamples = Math.round(sr * 0.025);
    const steady = Array.from(out.slice(attackSamples));
    const maxAmp = Math.max(...steady.map(Math.abs));
    if (maxAmp <= 1.02) { pass++; addResult('Proteção de Clipping: +6dBFS → limiter contenido', 'pass', `Pico pós-ataque: ${db(maxAmp).toFixed(2)} dBFS — sem clipping`); }
    else               { fail++; addResult('Proteção de Clipping: +6dBFS → limiter contenido', 'fail', `Pico: ${maxAmp.toFixed(4)} — CLIPPING detectado!`); }
  } catch(e) { fail++; addResult('Proteção de Clipping: +6dBFS → limiter contenido', 'fail', e.message); }
}

async function test_limiter_below_threshold() {
  // Signal at -6dBFS should pass through limiter UNCHANGED (ratio only acts above threshold)
  try {
    const sr = 44100; const dur = 0.5;
    const amp = 0.5; // -6dBFS
    const ctx = new OfflineAudioContext(1, Math.round(sr * dur), sr);
    const src = ctx.createBufferSource();
    src.buffer = generateSine(ctx, 1000, dur, amp);
    const limiter = ctx.createDynamicsCompressor();
    limiter.threshold.value = -1; limiter.knee.value = 0;
    limiter.ratio.value = 20; limiter.attack.value = 0.001; limiter.release.value = 0.1;
    src.connect(limiter); limiter.connect(ctx.destination); src.start(0);
    const rendered = await ctx.startRendering();
    const outRms = rms(rendered.getChannelData(0));
    const inRms = sineRms(amp);
    const diff = Math.abs(db(outRms) - db(inRms));
    if (diff < 1.5) { pass++; addResult('Limiter: Sinal abaixo do threshold não alterado', 'pass', `Diff RMS: ${diff.toFixed(3)} dB — sinal passou sem compressão`); }
    else            { fail++; addResult('Limiter: Sinal abaixo do threshold não alterado', 'fail', `Diff: ${diff.toFixed(2)} dB — compressão indevida?`); }
  } catch(e) { fail++; addResult('Limiter: Sinal abaixo do threshold não alterado', 'fail', e.message); }
}

async function test_reverb_dry_zero() {
  // With wetGain=0, convolver output should be silent (dry=1.0 passes, wet=0 should be muted)
  try {
    const sr = 44100; const dur = 1.0;
    const ctx = new OfflineAudioContext(2, Math.round(sr * dur), sr);
    const src = ctx.createBufferSource();
    const imp = ctx.createBuffer(2, sr, sr);
    for (let c = 0; c < 2; c++) imp.getChannelData(c)[0] = 0.9;
    src.buffer = imp;
    const irLen = sr * 2;
    const irBuf = ctx.createBuffer(2, irLen, sr);
    for (let c = 0; c < 2; c++) {
      const d = irBuf.getChannelData(c);
      for (let i = 0; i < irLen; i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/irLen, 2.5);
    }
    const convolver = ctx.createConvolver(); convolver.buffer = irBuf;
    const wetGain = ctx.createGain(); wetGain.gain.value = 0.0; // WET = 0
    src.connect(convolver); convolver.connect(wetGain); wetGain.connect(ctx.destination); src.start(0);
    const rendered = await ctx.startRendering();
    const tailRms = rms(rendered.getChannelData(0).slice(100, 5000));
    if (tailRms < 0.001) { pass++; addResult('Reverb: wet=0 → saída silenciosa', 'pass', `RMS da cauda: ${db(tailRms).toFixed(2)} dB — reverb correto desativado`); }
    else                 { fail++; addResult('Reverb: wet=0 → saída silenciosa', 'fail', `RMS da cauda: ${db(tailRms).toFixed(2)} dB — vazamento de reverb!`); }
  } catch(e) { fail++; addResult('Reverb: wet=0 → saída silenciosa', 'fail', e.message); }
}

async function test_crossfeed_headshadow_filter() {
  // The head-shadow lowpass (700Hz) in crossfeed should attenuate 5kHz significantly
  try {
    const sr = 44100; const dur = 0.3;
    const len = Math.round(sr * dur);
    const render = async (freq) => {
      const ctx = new OfflineAudioContext(1, len, sr);
      const src = ctx.createBufferSource();
      const buf = ctx.createBuffer(1, len, sr);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.sin(2*Math.PI*freq*i/sr);
      src.buffer = buf;
      const hs = ctx.createBiquadFilter(); hs.type = 'lowpass'; hs.frequency.value = 700;
      src.connect(hs); hs.connect(ctx.destination); src.start(0);
      const r = await ctx.startRendering();
      return rms(r.getChannelData(0));
    };
    const [rms200, rms5k] = await Promise.all([render(200), render(5000)]);
    const attDb = db(rms5k) - db(rms200);
    if (attDb < -6) { pass++; addResult('Crossfeed Head-Shadow: 700Hz LP atenua 5kHz', 'pass', `Atenuação em 5kHz: ${attDb.toFixed(2)} dB (esperado < -6dB)`); }
    else            { fail++; addResult('Crossfeed Head-Shadow: 700Hz LP atenua 5kHz', 'fail', `Atenuação: ${attDb.toFixed(2)} dB — filtro não está atenuando?`); }
  } catch(e) { fail++; addResult('Crossfeed Head-Shadow: 700Hz LP atenua 5kHz', 'fail', e.message); }
}

async function test_stereo_width_ultra_vs_natural() {
  // Ultra width should produce MORE side energy than Natural (0.4 vs 2.2 gain on side bus)
  try {
    const sr = 44100; const dur = 0.3;
    const len = Math.round(sr * dur);
    const renderWidth = async (widthGain) => {
      const ctx = new OfflineAudioContext(2, len, sr);
      const buf = ctx.createBuffer(2, len, sr);
      const l = buf.getChannelData(0); const r = buf.getChannelData(1);
      for (let i = 0; i < len; i++) { l[i] = Math.random()*2-1; r[i] = Math.random()*2-1; }
      const src = ctx.createBufferSource(); src.buffer = buf;
      const splitter = ctx.createChannelSplitter(2);
      const merger = ctx.createChannelMerger(2);
      const midL = ctx.createGain(); midL.gain.value = 0.5;
      const midR = ctx.createGain(); midR.gain.value = 0.5;
      const midBus = ctx.createGain();
      const sideP = ctx.createGain(); sideP.gain.value = 0.5;
      const sideN = ctx.createGain(); sideN.gain.value = -0.5;
      const sideBus = ctx.createGain(); sideBus.gain.value = widthGain;
      const sideInv = ctx.createGain(); sideInv.gain.value = -1;
      src.connect(splitter);
      splitter.connect(midL,0); splitter.connect(midR,1); midL.connect(midBus); midR.connect(midBus);
      splitter.connect(sideP,0); splitter.connect(sideN,1); sideP.connect(sideBus); sideN.connect(sideBus);
      sideBus.connect(sideInv);
      midBus.connect(merger,0,0); sideBus.connect(merger,0,0);
      midBus.connect(merger,0,1); sideInv.connect(merger,0,1);
      merger.connect(ctx.destination); src.start(0);
      const rendered = await ctx.startRendering();
      const oL = rendered.getChannelData(0); const oR = rendered.getChannelData(1);
      return rms(oL.map((s,i) => s - oR[i]));
    };
    const [rmsNatural, rmsUltra] = await Promise.all([renderWidth(1.0), renderWidth(2.2)]);
    const diff = db(rmsUltra) - db(rmsNatural);
    if (diff > 3) { pass++; addResult('Stereo Width: Ultra tem mais energia lateral que Natural', 'pass', `Diferença: +${diff.toFixed(2)} dB (esperado > 3dB)`); }
    else          { fail++; addResult('Stereo Width: Ultra tem mais energia lateral que Natural', 'fail', `Diferença: ${diff.toFixed(2)} dB — muito pequena`); }
  } catch(e) { fail++; addResult('Stereo Width: Ultra tem mais energia lateral que Natural', 'fail', e.message); }
}

async function test_mono_compatibility() {
  // Summing L+R of M/S processed stereo should be approximately equal to 2×mid
  try {
    const sr = 44100; const dur = 0.3; const len = Math.round(sr * dur);
    const ctx = new OfflineAudioContext(2, len, sr);
    const buf = ctx.createBuffer(2, len, sr);
    const l = buf.getChannelData(0); const r = buf.getChannelData(1);
    for (let i = 0; i < len; i++) { l[i] = Math.random()*2-1; r[i] = Math.random()*2-1; }
    const src = ctx.createBufferSource(); src.buffer = buf;
    const splitter = ctx.createChannelSplitter(2);
    const merger = ctx.createChannelMerger(2);
    const midL = ctx.createGain(); midL.gain.value = 0.5;
    const midR = ctx.createGain(); midR.gain.value = 0.5;
    const midBus = ctx.createGain();
    const sideP = ctx.createGain(); sideP.gain.value = 0.5;
    const sideN = ctx.createGain(); sideN.gain.value = -0.5;
    const sideBus = ctx.createGain(); sideBus.gain.value = 1.0; // natural
    const sideInv = ctx.createGain(); sideInv.gain.value = -1;
    src.connect(splitter);
    splitter.connect(midL,0); splitter.connect(midR,1); midL.connect(midBus); midR.connect(midBus);
    splitter.connect(sideP,0); splitter.connect(sideN,1); sideP.connect(sideBus); sideN.connect(sideBus);
    sideBus.connect(sideInv);
    midBus.connect(merger,0,0); sideBus.connect(merger,0,0);
    midBus.connect(merger,0,1); sideInv.connect(merger,0,1);
    merger.connect(ctx.destination); src.start(0);
    const rendered = await ctx.startRendering();
    const oL = rendered.getChannelData(0); const oR = rendered.getChannelData(1);
    // In M/S: outL = mid + side, outR = mid - side  →  outL + outR = 2×mid (side cancels)
    const monoSum = oL.map((s,i) => (s + oR[i]) / 2); // normalize
    // Compare to original mid (L+R)/2 of input
    const origMid = l.map((s,i) => (s + r[i]) / 2);
    const rmsSum = rms(monoSum); const rmsMid = rms(origMid);
    const diff = Math.abs(db(rmsSum) - db(rmsMid));
    if (diff < 1.5) { pass++; addResult('Compatibilidade Mono: M/S → soma L+R = mid original', 'pass', `Diff: ${diff.toFixed(3)} dB — compatível com mono`); }
    else            { fail++; addResult('Compatibilidade Mono: M/S → soma L+R = mid original', 'fail', `Diff: ${diff.toFixed(2)} dB — incompatibilidade mono detectada`); }
  } catch(e) { fail++; addResult('Compatibilidade Mono: M/S → soma L+R = mid original', 'fail', e.message); }
}

async function test_reverb_decay_time() {
  // After an impulse, reverb should still have energy at ~500ms but less at ~800ms
  try {
    const sr = 44100; const dur = 2.0;
    const ctx = new OfflineAudioContext(2, Math.round(sr * dur), sr);
    const imp = ctx.createBuffer(2, Math.round(sr * dur), sr);
    for (let c = 0; c < 2; c++) imp.getChannelData(c)[0] = 0.9;
    const src = ctx.createBufferSource(); src.buffer = imp;
    const irLen = Math.round(sr * 3.5);
    const irBuf = ctx.createBuffer(2, irLen, sr);
    for (let c = 0; c < 2; c++) {
      const d = irBuf.getChannelData(c);
      // Expoente 5.0 garante decaimento mais rápido (testável nos primeiros 800ms)
      for (let i = 0; i < irLen; i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/irLen, 5.0);
    }
    const conv = ctx.createConvolver(); conv.buffer = irBuf;
    src.connect(conv); conv.connect(ctx.destination); src.start(0);
    const rendered = await ctx.startRendering();
    const out = rendered.getChannelData(0);
    const at500ms = rms(out.slice(Math.round(sr*0.45), Math.round(sr*0.55)));
    const at800ms = rms(out.slice(Math.round(sr*0.75), Math.round(sr*0.85)));
    const decay = db(at800ms) - db(at500ms);
    if (at500ms > 0.0001 && decay < -2) { pass++; addResult('Reverb: Decaimento temporal (RT60)', 'pass', `RMS @500ms: ${db(at500ms).toFixed(1)}dB | @800ms: ${db(at800ms).toFixed(1)}dB | Decay: ${decay.toFixed(1)}dB`); }
    else { fail++; addResult('Reverb: Decaimento temporal (RT60)', 'fail', `Decaimento insuficiente: ${decay.toFixed(2)}dB em 300ms`); }
  } catch(e) { fail++; addResult('Reverb: Decaimento temporal (RT60)', 'fail', e.message); }
}
